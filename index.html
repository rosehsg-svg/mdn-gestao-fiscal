<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MDN Gestão Fiscal — Demonstração</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#26313d;font:16px Arial,sans-serif}header{background:white;padding:20px;border-bottom:4px solid #b51b30}header h1{color:#b51b30;margin:0}header p{margin:5px 0;color:#666}nav{display:flex;overflow-x:auto;gap:8px;background:white;padding:12px}button{cursor:pointer;border-radius:8px;padding:11px;border:1px solid #ddd;background:white}button.active,.primary{background:#b51b30;color:white;border-color:#b51b30}main{max-width:1100px;margin:auto;padding:20px}section{display:none}section.active{display:block}.card{background:white;border:1px solid #e1e3e6;border-radius:12px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}input,select{display:block;width:100%;padding:11px;margin:7px 0 12px;border:1px solid #bbb;border-radius:7px}label{display:block}small{color:#666}footer{text-align:center;padding:25px;color:#666}@media(max-width:600px){main{padding:12px}header h1{font-size:24px}}</style></head><body><header><h1>MDN <span style="font-weight:400">Gestão Fiscal</span></h1><p>MDN Serviços Médicos · Demonstração pública</p></header><nav id="nav"></nav><main id="main"></main><footer>Ambiente demonstrativo · Não cadastre documentos ou dados confidenciais · Sem emissão fiscal oficial</footer><script>
const tabs=[["inicio","Visão geral"],["institucional","MDN Institucional"],["contratantes","Contratantes"],["contratos","Contratos"],["documentos","Documentos"],["notas","Notas fiscais"],["financeiro","Financeiro"],["contabilidade","Contabilidade"],["balancos","Balanços"],["certidoes","Certidões"],["certificado","Certificado digital"],["integracoes","Integrações"]];
const state={clientes:["Instituto Positiva","IMP","ECO"],contratos:[],notas:[],movimentos:[]};
const clean=x=>String(x||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const box=(t,c)=>'<div class="card"><h3>'+t+'</h3>'+c+'</div>';
function content(id){switch(id){
case "inicio":return '<h2>Painel administrativo</h2><div class="grid">'+["Escrituração fiscal","Apuração tributária","Conferência automática","Obrigações fiscais","Relatórios contábeis","Auditoria e histórico"].map(t=>box(t,"Módulo em desenvolvimento")).join("")+'</div>'+box("Regras de emissão","Alerta no dia 20 · Emissão programada para dia 25 · Conferência obrigatória");
case "institucional":return '<h2>MDN Institucional</h2>'+box("Documentos por data e tipo","Constituição e registros · Certidões · Contabilidade e fiscal · Financeiro · Jurídico · Identidade e materiais");
case "contratantes":return '<h2>Contratantes</h2>'+box("Cadastro",'<ul>'+state.clientes.map(c=>'<li>'+clean(c)+'</li>').join("")+'</ul><form data-type="cliente"><label>Novo contratante<input name="nome" required></label><button class="primary">Adicionar</button></form>');
case "contratos":return '<h2>Contratos</h2>'+box("Cadastro de contratos",'<form data-type="contrato"><label>Contratante<select name="cliente">'+state.clientes.map(c=>'<option>'+clean(c)+'</option>').join("")+'</select></label><label>Objeto<input name="objeto" required></label><label>Vencimento<input type="date" name="data"></label><button class="primary">Cadastrar</button></form><ul>'+state.contratos.map(x=>'<li>'+clean(x.cliente)+' — '+clean(x.objeto)+'</li>').join("")+'</ul>');
case "documentos":return '<h2>Central de Documentos</h2>'+box("MDN — Institucional","Constituição · Certidões · Contabilidade · Financeiro · Jurídico · Identidade")+box("Contratantes",state.clientes.map(clean).join(" · "))+box("Segurança","Armazenamento de anexos reais dependerá de autenticação e servidor privado. Não envie arquivos neste site.");
case "notas":return '<h2>Notas fiscais</h2>'+box("Regra mensal","Dia 20: alerta · Dia 25: emissão programada · Conferência prévia obrigatória")+box("Previsões demonstrativas",'<form data-type="nota"><label>Competência<input type="month" name="competencia" required></label><label>Contratante<select name="cliente">'+state.clientes.map(c=>'<option>'+clean(c)+'</option>').join("")+'</select></label><label>Valor previsto<input type="number" name="valor" step=".01" min="0" required></label><label><input type="checkbox" name="conferido" style="width:auto;display:inline"> Conferência realizada</label><button class="primary">Registrar previsão</button></form><ul>'+state.notas.map(x=>'<li>'+clean(x.competencia)+' · '+clean(x.cliente)+' · R$ '+clean(x.valor)+' · '+(x.conferido?'Conferida':'Pendente')+'</li>').join("")+'</ul>');
case "financeiro":return '<h2>Financeiro</h2>'+box("Fluxo de caixa e conciliação","Contas a pagar, receber, pagamentos parciais e contratos: integração futura com Livro Caixa.");
case "contabilidade":return '<h2>Contabilidade</h2>'+box("Lançamentos de demonstração",'<form data-type="movimento"><label>Descrição<input name="descricao" required></label><label>Valor<input type="number" name="valor" step=".01" min=".01" required></label><label>Tipo<select name="tipo"><option value="receita">Receita</option><option value="despesa">Despesa</option></select></label><button class="primary">Registrar</button></form><ul>'+state.movimentos.map(x=>'<li>'+clean(x.descricao)+' · '+clean(x.tipo)+' · R$ '+clean(x.valor)+'</li>').join("")+'</ul>');
case "balancos":{const r=state.movimentos.filter(x=>x.tipo==="receita").reduce((a,x)=>a+ +x.valor,0),d=state.movimentos.filter(x=>x.tipo==="despesa").reduce((a,x)=>a+ +x.valor,0);return '<h2>Demonstrativos</h2>'+box("DRE demonstrativa","Receitas: R$ "+r.toFixed(2)+"<p>Despesas: R$ "+d.toFixed(2)+"</p><b>Resultado: R$ "+(r-d).toFixed(2)+"</b>")+box("Balanço Patrimonial","Balanço real exige partidas dobradas, saldos iniciais e conciliação. Não há balanço oficial nesta demonstração.")}
case "certidoes":return '<h2>Certidões</h2>'+box("Regularidade","RFB/PGFN · FGTS · CNDT · Estadual · Municipal. Consulta e emissão oficiais não conectadas.");
case "certificado":return '<h2>Certificado digital</h2>'+box("e-CNPJ A1/A3","Integração futura com armazenamento protegido. Não envie arquivo PFX nem senhas.");
case "integracoes":return '<h2>Integrações fiscais</h2>'+box("Homologação","NFS-e, certidões e serviços oficiais exigem credenciamento e homologação. Nenhuma API oficial está ativa.");
}}
const nav=document.getElementById("nav"),main=document.getElementById("main");
function render(active){nav.innerHTML=tabs.map(([id,t])=>'<button data-tab="'+id+'" class="'+(id===active?'active':'')+'">'+t+'</button>').join("");main.innerHTML=tabs.map(([id])=>'<section id="'+id+'" class="'+(id===active?'active':'')+'">'+content(id)+'</section>').join("")}
nav.addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b){location.hash=b.dataset.tab;render(b.dataset.tab)}});
main.addEventListener("submit",e=>{e.preventDefault();const f=e.target,type=f.dataset.type,d=new FormData(f);if(type==="cliente")state.clientes.push(d.get("nome"));if(type==="contrato")state.contratos.push(Object.fromEntries(d));if(type==="nota")state.notas.push({...Object.fromEntries(d),conferido:d.has("conferido")});if(type==="movimento")state.movimentos.push(Object.fromEntries(d));render(f.closest("section").id)});
window.addEventListener("hashchange",()=>{const id=location.hash.slice(1);if(tabs.some(x=>x[0]===id))render(id)});
render(tabs.some(x=>x[0]===location.hash.slice(1))?location.hash.slice(1):"inicio");
</script></body></html>
