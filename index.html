<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>MDN Gestão Fiscal | Painel de Gestão</title><style>
:root{--red:#b91f32;--dark:#202936;--muted:#66717e;--line:#e7e9ed;--bg:#f5f6f8;--white:#fff;--soft:#fff2f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--dark)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #dc7d88;outline-offset:2px}.shell{display:grid;grid-template-columns:255px minmax(0,1fr);min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--line);padding:22px 13px;position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:9px 11px 19px;border-bottom:1px solid var(--line);margin-bottom:15px}.brand .name{font-size:31px;font-weight:850;letter-spacing:-1.6px;color:var(--red);line-height:1}.brand .name span{font-size:11px;letter-spacing:.9px;font-weight:700;vertical-align:middle;margin-left:6px;color:#47515e}.brand svg{display:block;width:100%;height:28px;margin:4px 0}.brand small{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.5px}.group-label{font-size:10px;font-weight:800;letter-spacing:1.3px;color:#8c939d;padding:15px 13px 7px;text-transform:uppercase}.navbtn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;border-radius:10px;background:transparent;padding:11px 12px;color:#4b5665;font-weight:570}.navbtn .symbol{font-size:19px;width:24px;text-align:center}.navbtn.active{background:var(--soft);color:#9f172a;font-weight:750}.navbtn:hover{background:#f5f6f8}.sidebar-foot{margin:25px 9px;padding:12px;background:#f7f8fa;border-radius:10px;font-size:11px;color:var(--muted)}.workspace{min-width:0}.topbar{height:75px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:15px}.topbar strong{font-size:14px}.topbar .right{display:flex;align-items:center;gap:9px}.tag{font-size:11px;color:#a32234;background:#fff0f2;border:1px solid #f3d6db;border-radius:100px;padding:5px 11px;font-weight:700}.avatar{display:grid;place-items:center;background:#f7e9eb;color:var(--red);font-weight:800;border-radius:50%;width:35px;height:35px}.mobilemenu{display:none}.main{max-width:1380px;margin:0 auto;padding:32px 34px 65px}.eyebrow{color:var(--red);text-transform:uppercase;letter-spacing:1.5px;font-size:11px;font-weight:800}.heading{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:24px}.heading h1{font-size:29px;letter-spacing:-.7px;margin:4px 0 3px}.heading p{color:var(--muted);margin:0}.btn{border:1px solid #d8dce2;background:#fff;color:#303b49;padding:10px 15px;border-radius:9px;font-weight:700}.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.grid{display:grid;gap:17px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:21px;box-shadow:0 3px 12px #17212b06}.metric .label{font-size:12px;color:var(--muted);font-weight:700}.metric .value{font-size:28px;font-weight:850;letter-spacing:-.7px;margin-top:8px}.metric .sub{font-size:11px;color:var(--muted);margin-top:3px}.metric .symbol{float:right;color:var(--red);font-size:23px}.columns{grid-template-columns:minmax(0,1.7fr) minmax(270px,1fr);margin-top:19px}.card h2{font-size:16px;margin:0 0 6px}.card .desc{font-size:12px;color:var(--muted);margin:0 0 18px}.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick button{background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px;text-align:left;display:flex;align-items:center;gap:12px;font-weight:700}.quick button:hover{border-color:var(--red);background:#fffafa}.quick .symbol{font-size:22px;color:var(--red)}.notice{border-left:3px solid var(--red);padding:11px 14px;background:#fff7f7;border-radius:6px;margin:10px 0;font-size:13px}.notice strong{display:block}.notice small{color:var(--muted)}.item{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:center}.item:last-child{border-bottom:0}.folder{display:grid;place-items:center;min-width:37px;height:37px;border-radius:9px;background:#fff1f2;color:var(--red);font-size:19px}.item b{display:block;font-size:13px}.item small{display:block;color:var(--muted)}.pill{display:inline-block;border-radius:100px;background:#f4f5f7;color:#53606d;padding:4px 10px;font-size:11px;font-weight:700;margin:4px}.section{display:none}.section.active{display:block}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.field{display:block;font-weight:650;font-size:12px;margin-bottom:12px}.field input,.field select{display:block;width:100%;border:1px solid #d7dce3;background:white;border-radius:8px;padding:11px;margin-top:6px;color:var(--dark)}.field input[type=checkbox]{width:auto;display:inline}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 13px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#7b8490}td{color:#3e4956}.empty{color:#8a939e;text-align:center;padding:25px}.warning{color:#8a4e0a;background:#fff8e9;padding:12px;border-radius:8px;font-size:12px}.status{font-size:11px;background:#fff1f2;color:#a61f32;padding:4px 9px;border-radius:40px}.footnote{font-size:12px;color:var(--muted);margin-top:16px}
@media(max-width:1050px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.columns{grid-template-columns:1fr}}@media(max-width:750px){.shell{display:block}.sidebar{display:none;position:fixed;z-index:60;top:0;bottom:0;width:min(310px,88vw);height:100vh;box-shadow:0 0 0 100vw #17202a88}.sidebar.open{display:block}.topbar{height:65px;padding:0 17px}.mobilemenu{display:block;border:0;background:white;font-size:24px;color:var(--red)}.topbar .right .tag{display:none}.main{padding:23px 14px 50px}.heading{align-items:start}.heading h1{font-size:25px}.heading .btn{font-size:12px}.metrics{gap:10px}.metric{padding:15px}.metric .value{font-size:23px}.card{padding:17px}.quick{grid-template-columns:1fr 1fr}.quick button{padding:12px;font-size:12px}.two,.three,.formgrid{grid-template-columns:1fr}}
</style><style>
.demo-banner{background:linear-gradient(105deg,#9d1c2d,#c93446);color:#fff;border-radius:16px;padding:22px 25px;margin:0 0 20px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.demo-banner h2{margin:0 0 5px;font-size:21px}.demo-banner p{margin:0;font-size:13px;opacity:.92}.demo-banner .btn{background:white;color:#9d1c2d;border:0}.demo-banner .btn.secondary{background:transparent;color:#fff;border:1px solid #ffffffaa}.demo-actions{display:flex;gap:8px;flex-wrap:wrap}.guide{background:#fff;border:1px solid #e7e9ed;border-radius:14px;padding:18px;margin-bottom:20px}.guide-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.guide-head strong{font-size:15px}.guide ol{padding-left:23px;margin:12px 0 0}.guide li{padding:5px 0;color:#485563}.guide li button{background:none;border:0;padding:2px 5px;color:#a32234;text-decoration:underline;font-weight:700}.demo-flag{display:inline-block;background:#fff0d9;color:#81530c;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:750}.demo-alert{background:#fff8e9;border:1px solid #f4dfb7;padding:12px;border-radius:9px;font-size:12px;margin-bottom:15px}.quick button{min-height:60px}@media(max-width:750px){.demo-banner{padding:18px}.demo-banner h2{font-size:18px}.demo-actions{width:100%}.demo-actions .btn{flex:1;font-size:12px}.guide{padding:15px}}
</style><style>.howto{background:#fff;border:1px solid #e7e9ed;border-left:4px solid #b91f32;border-radius:12px;padding:17px 19px;display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}.howto-kicker{display:block;color:#b91f32;font-size:10px;font-weight:800;letter-spacing:1.1px;margin-bottom:5px}.howto strong{display:block;font-size:15px}.howto p{color:#66717e;margin:4px 0 0;font-size:13px}.howto button{background:#fff;border:1px solid #e0b3ba;color:#a11b2c;border-radius:9px;padding:10px 13px;font-size:12px;font-weight:750;min-width:175px}@media(max-width:750px){.howto{display:block}.howto button{margin-top:12px;width:100%}}</style></head><body><div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><div class="name">MDN<span>SERVIÇOS MÉDICOS</span></div><svg viewBox="0 0 230 30" aria-hidden="true"><path d="M0 16H65l8-4 8 10 7-18 10 24 8-12h124" fill="none" stroke="#b91f32" stroke-width="2.6" stroke-linejoin="round"/></svg><small>GESTÃO FISCAL & EMPRESARIAL</small></div><div id="nav"></div><div class="sidebar-foot">Ambiente de demonstração<br>Sem dados fiscais reais e sem emissão oficial</div></aside><div class="workspace"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="mobilemenu" id="mobilemenu" aria-label="Abrir menu">☰</button><strong>MDN Gestão Fiscal</strong></div><div class="right"><span class="tag">AMBIENTE DE TESTES</span><span class="avatar">M</span></div></header><main class="main" id="main"></main></div></div><script>
const groups=[
["01 · COMEÇAR",[["inicio","◫","Painel de gestão"],["institucional","▣","Minha empresa · MDN"]]],
["02 · ORGANIZAR A OPERAÇÃO",[["contratantes","♧","Contratantes"],["contratos","▤","Contratos e aditivos"]]],
["03 · FATURAR E RECEBER",[["notas","▤","Notas fiscais"],["receber","↗","Contas a receber"]]],
["04 · CONTROLAR DESPESAS",[["pagar","↙","Contas a pagar"],["financeiro","▥","Bancos e conciliação"]]],
["05 · CUMPRIR OBRIGAÇÕES",[["certidoes","◷","Certidões e prazos"],["contabilidade","▦","Contabilidade e tributos"]]],
["06 · CONFERIR RESULTADOS",[["balancos","▥","Balanços e relatórios"],["auditoria","⌕","Auditoria e conferência"]]],
["07 · CONSULTAR E CONFIGURAR",[["documentos","▧","Central de documentos"],["certificado","◇","Certificado digital"],["integracoes","⇄","Integrações fiscais"]]]
];
const tabs=groups.flatMap(g=>g[1]);const state={clientes:["Instituto Positiva","IMP","ECO"],contratos:[],notas:[],movimentos:[],titulos:[],certidoes:[]};let demoLoaded=false;
const safe=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const card=(title,body,desc="")=>'<article class="card"><h2>'+title+'</h2>'+(desc?'<p class="desc">'+desc+'</p>':'')+body+'</article>';const heading=(title,desc,extra="")=>'<div class="heading"><div><div class="eyebrow">MDN Serviços Médicos</div><h1>'+title+'</h1><p>'+desc+'</p></div>'+extra+'</div>';const item=(ico,title,desc)=>'<div class="item"><span class="folder">'+ico+'</span><div><b>'+title+'</b><small>'+desc+'</small></div></div>';const options=()=>state.clientes.map(x=>'<option>'+safe(x)+'</option>').join("");const empty='<div class="empty">Nenhum registro de demonstração cadastrado.</div>';
function receivableView(tipo){
const isReceive=tipo==="receber",name=isReceive?"Contas a receber":"Contas a pagar";
const rows=state.titulos.filter(x=>x.tipo===tipo);
return heading(name,isReceive?"Acompanhe o que os contratantes devem pagar à MDN.":"Acompanhe despesas e obrigações que a MDN precisa pagar.")
+card("Cadastrar "+(isReceive?"recebimento previsto":"pagamento previsto"),'<form data-type="titulo"><input type="hidden" name="tipo" value="'+tipo+'"><div class="formgrid"><label class="field">'+(isReceive?"Contratante":"Fornecedor / beneficiário")+'<input name="parte" required></label><label class="field">Vencimento<input type="date" name="vencimento" required></label><label class="field">Valor (R$)<input type="number" name="valor" step=".01" min=".01" required></label><label class="field">Descrição<input name="descricao" required></label></div><button class="btn primary">Registrar previsão</button></form>')
+card("Registros de demonstração",rows.length?'<div class="tablewrap"><table><thead><tr><th>Descrição</th><th>Parte</th><th>Vencimento</th><th>Valor</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+safe(x.descricao)+'</td><td>'+safe(x.parte)+'</td><td>'+safe(x.vencimento)+'</td><td>R$ '+Number(x.valor).toLocaleString("pt-BR",{minimumFractionDigits:2})+'</td></tr>').join("")+'</tbody></table></div>':empty);
}
function view(id){switch(id){
case "inicio":return heading("Visão geral","Resumo operacional")+'<div class="grid metrics">'+[['◷','20','Alerta de notas','Todo dia 20'],['▤','25','Emissão prevista','Conferência obrigatória'],['▧','12','Áreas do sistema','Navegação por categoria'],['◫','0','Dados reais','Nenhum dado importado']].map(x=>'<div class="card metric"><span class="symbol">'+x[0]+'</span><div class="label">'+x[2]+'</div><div class="value">'+x[1]+'</div><div class="sub">'+x[3]+'</div></div>').join("")+'</div><div class="grid columns">'+card("Acesso rápido",'<div class="quick">'+[['contratantes','♧','Contratantes'],['contratos','▤','Contratos'],['documentos','▧','Documentos'],['notas','▤','Notas fiscais'],['financeiro','▥','Financeiro'],['balancos','▦','Balanços']].map(x=>'<button type="button" data-go="'+x[0]+'"><span class="symbol">'+x[1]+'</span>'+x[2]+'</button>').join("")+'</div>','Módulos principais')+card("Agenda e alertas",'<div class="notice"><strong>Dia 20 — Aviso de emissão</strong><small>Verificar as notas previstas para o mês.</small></div><div class="notice"><strong>Dia 25 — Emissão programada</strong><small>Conferência prévia obrigatória; emissão oficial não integrada.</small></div><div class="warning">As datas são regras operacionais provisórias, não prazos legais.</div>','Regras de emissão MDN')+'</div>';
case "institucional":return heading("MDN Institucional","Documentação própria organizada por tipo, ano e mês")+ '<div class="grid two">'+card("Constituição e regularidade",item("▧","Constituição e registros","Contrato social, CNPJ, alterações e licenças")+item("◷","Certidões","Federais, estaduais, municipais, FGTS e trabalhistas")+item("◇","Jurídico e administrativo","Procurações, notificações e documentos legais"))+card("Contabilidade e identidade",item("▦","Contabilidade e fiscal","Livros, declarações, guias e balanços")+item("▥","Bancário e financeiro","Extratos, recibos e comprovantes")+item("✦","Identidade e materiais","Logotipos, apresentações e documentos institucionais"))+'</div>'+card("Preservação documental",'<p>Originais, versões anteriores, documentos substituídos e trilhas de auditoria serão preservados. O acervo real ainda não foi migrado.</p>');
case "contratantes":return heading("Contratantes","Clientes e instituições contratantes da MDN")+card("Contratantes cadastrados",'<div>'+state.clientes.map(x=>'<span class="pill">'+safe(x)+'</span>').join("")+'</div>')+card("Cadastrar novo contratante",'<form data-type="cliente"><label class="field">Nome ou razão social<input name="nome" required placeholder="Nome do contratante"></label><button class="btn primary">Adicionar contratante</button></form>','Dados temporários apenas para testar a interface');
case "contratos":return heading("Contratos e aditivos","Gestão de contratos de qualquer natureza")+card("Novo contrato demonstrativo",'<form data-type="contrato"><div class="formgrid"><label class="field">Contratante<select name="cliente">'+options()+'</select></label><label class="field">Vencimento<input type="date" name="data"></label></div><label class="field">Objeto<input name="objeto" required placeholder="Descrição do serviço ou objeto"></label><button class="btn primary">Cadastrar contrato</button></form>')+card("Contratos cadastrados",state.contratos.length?state.contratos.map(x=>item("▤",safe(x.objeto),safe(x.cliente)+" · "+safe(x.data))).join(""):empty);
case "receber":return receivableView("receber");
case "pagar":return receivableView("pagar");
case "pagarreceber":return heading("Contas a pagar e receber","Controle de compromissos e recebimentos, inspirado em rotinas de ERP")+card("Novo título demonstrativo",'<form data-type="titulo"><div class="formgrid"><label class="field">Natureza<select name="tipo"><option value="receber">A receber</option><option value="pagar">A pagar</option></select></label><label class="field">Contratante / fornecedor<input name="parte" required placeholder="Identificação"></label><label class="field">Vencimento<input type="date" name="vencimento" required></label><label class="field">Valor (R$)<input type="number" name="valor" step=".01" min=".01" required></label></div><label class="field">Descrição<input name="descricao" required></label><button class="btn primary">Registrar título</button></form>')+card("Títulos cadastrados",state.titulos.length?'<div class="tablewrap"><table><thead><tr><th>Natureza</th><th>Parte</th><th>Vencimento</th><th>Valor</th><th>Situação</th></tr></thead><tbody>'+state.titulos.map(x=>'<tr><td>'+safe(x.tipo)+'</td><td>'+safe(x.parte)+'</td><td>'+safe(x.vencimento)+'</td><td>R$ '+Number(x.valor).toLocaleString("pt-BR",{minimumFractionDigits:2})+'</td><td><span class="status">Pendente</span></td></tr>').join("")+'</tbody></table></div>':empty);
case "auditoria":return heading("Conferência e auditoria","Verificações preventivas e inconsistências documentais")+card("Verificações automáticas de demonstração",'<div class="grid two">'+item("⌕","Notas sem conferência",state.notas.filter(x=>!x.conferido).length+" pendência(s) em registros de teste")+item("⌕","Contratos sem vencimento",state.contratos.filter(x=>!x.data).length+" contrato(s) de teste")+item("⌕","Títulos pendentes",state.titulos.length+" registro(s) ainda sem baixa")+item("⌕","Evidências fiscais","Nenhuma documentação oficial importada")+'</div>')+card("Próximas verificações",'<p>Duplicidades de NFS-e, notas substituídas, pagamentos parciais, retenções e conciliação entre contrato, nota e extrato serão verificadas quando houver integração com registros reais.</p>');
case "financeiro":return heading("Financeiro","Recebimentos, pagamentos e conciliação bancária")+ '<div class="grid three">'+card("Contas a receber","Controle de títulos, recebimentos parciais e inadimplência.")+card("Contas a pagar","Fornecedores, impostos, compromissos e comprovantes.")+card("Conciliação bancária","Vínculo entre banco, notas, contratos e documentos.")+'</div>'+card("Importação do Livro Caixa",'<div class="warning">Pendente. Nenhum extrato ou lançamento financeiro real foi importado para este ambiente público.</div>');
case "documentos":return heading("Central de documentos","MDN Institucional primeiro; depois, contratantes")+card("MDN — Documentação institucional",item("▧","Societário, fiscal e contábil","Organização por tipo, data, competência e versão")+item("◷","Certidões e vencimentos","Histórico de emissões e alertas")+item("▥","Financeiro e jurídico","Extratos, comprovantes, notificações e contratos"))+card("Contratantes",state.clientes.map(x=>'<span class="pill">'+safe(x)+'</span>').join(""))+card("Anexos e segurança",'<div class="warning">O envio de arquivos está desabilitado neste ambiente público. Documentos reais exigirão login e armazenamento privado.</div>');
case "notas":return heading("Notas fiscais","Emissão assistida, conferência e rastreabilidade")+card("Regra de emissão",'<div class="notice"><strong>Dia 20: primeiro alerta · Dia 25: emissão programada</strong><small>Conferência obrigatória antes de considerar a nota pronta. A emissão oficial exige integração homologada.</small></div>')+card("Cadastrar previsão",'<form data-type="nota"><div class="formgrid"><label class="field">Competência<input type="month" name="competencia" required></label><label class="field">Contratante<select name="cliente">'+options()+'</select></label></div><label class="field">Valor previsto (R$)<input type="number" min="0" step=".01" name="valor" required></label><label class="field"><input type="checkbox" name="conferido"> Conferência prévia realizada</label><button class="btn primary">Registrar previsão</button></form>')+card("Previsões cadastradas",state.notas.length?state.notas.map(x=>item("▤",safe(x.competencia)+" · "+safe(x.cliente),"R$ "+safe(x.valor)+" · "+(x.conferido?"Conferida":"Pendente"))).join(""):empty);
case "contabilidade":return heading("Escrituração contábil","Lançamentos e conferência — demonstração")+card("Lançamento simplificado de teste",'<form data-type="movimento"><label class="field">Descrição<input name="descricao" required></label><div class="formgrid"><label class="field">Valor (R$)<input type="number" min=".01" step=".01" name="valor" required></label><label class="field">Tipo<select name="tipo"><option value="receita">Receita</option><option value="despesa">Despesa</option></select></label></div><button class="btn primary">Registrar teste</button></form><p class="footnote">A escrituração real exigirá plano de contas e partidas dobradas.</p>')+card("Registros de teste",state.movimentos.length?state.movimentos.map(x=>item("▦",safe(x.descricao),safe(x.tipo)+" · R$ "+safe(x.valor))).join(""):empty);
case "balancos":{const r=state.movimentos.filter(x=>x.tipo==="receita").reduce((a,x)=>a+Number(x.valor),0),d=state.movimentos.filter(x=>x.tipo==="despesa").reduce((a,x)=>a+Number(x.valor),0);return heading("Balanços e relatórios","DRE, balancete, razão e balanço patrimonial")+ '<div class="grid three">'+[['Receitas de teste',r],['Despesas de teste',d],['Resultado de teste',r-d]].map(x=>card(x[0],'<div class="metric value">R$ '+x[1].toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+'</div>')).join("")+'</div>'+card("Balanço Patrimonial",'<div class="warning">Ainda não calculado. É necessário importar saldos iniciais, plano de contas, partidas dobradas e ajustes conciliados. A DRE acima é apenas ilustrativa.</div>');}
case "certidoes":return heading("Certidões e prazos","Regularidade fiscal e acompanhamento de validade")+card("Cadastrar validade demonstrativa",'<form data-type="certidao"><div class="formgrid"><label class="field">Tipo<select name="tipo"><option>RFB / PGFN</option><option>FGTS</option><option>CNDT</option><option>Estadual</option><option>Municipal</option><option>Outra</option></select></label><label class="field">Vencimento<input type="date" name="vencimento" required></label></div><button class="btn primary">Registrar validade</button></form>')+card("Prazos cadastrados",state.certidoes.length?state.certidoes.map(x=>item("◷",safe(x.tipo), "Vence em "+safe(x.vencimento)+" · "+(Math.ceil((new Date(x.vencimento+"T12:00:00")-new Date())/86400000)<=30?"Atenção: até 30 dias":"Prazo registrado"))).join(""):empty)+card("Órgãos",["RFB / PGFN","FGTS","CNDT","Estadual","Municipal"].map(x=>item("◷",x,"Emissão oficial ainda não conectada")).join(""));
case "certificado":return heading("Certificado digital","Gestão segura de credenciais e validade")+card("e-CNPJ A1 / A3",'<div class="warning">Não envie arquivos PFX, senhas ou chaves privadas. A integração exige infraestrutura protegida e controles de acesso.</div>');
case "integracoes":return heading("Integrações fiscais","Credenciamento, homologação e serviços oficiais")+card("Integrações previstas",item("⇄","NFS-e","Emissão, consulta, cancelamento e substituição após homologação")+item("⇄","Certidões","Consulta e emissão quando o órgão oferecer integração compatível")+item("◇","Assinatura digital","Certificado e autenticação em ambiente seguro"));}
}

function demoToolbar(){
return '<div class="demo-banner"><div><h2>Dados de demonstração</h2><p>Registros fictícios para teste dos módulos.</p></div><div class="demo-actions"><button class="btn" type="button" data-demo="load">Carregar dados</button><button class="btn secondary" type="button" data-demo="reset">Limpar dados</button></div></div>'
+'<div class="guide"><div class="guide-head"><strong>Módulos</strong><span class="demo-flag">DADOS FICTÍCIOS</span></div><ol>'
+[['contratantes','Conheça os contratantes'],['contratos','Contratos'],['notas','Notas fiscais'],['pagarreceber','Analise as contas a pagar e receber'],['auditoria','Auditoria'],['balancos','Balanços e relatórios']].map(x=>'<li><button type="button" data-go="'+x[0]+'">'+x[1]+'</button></li>').join('')+'</ol></div>';
}

const nav=document.getElementById("nav"),main=document.getElementById("main"),sidebar=document.getElementById("sidebar");let current="inicio";
function go(id){if(!tabs.some(x=>x[0]===id))id="inicio";current=id;main.innerHTML='<section class="section active">'+(id==="inicio"?demoToolbar():"<div class=\"demo-alert\">Ambiente demonstrativo: dados fictícios e temporários. Não insira informações confidenciais.</div>")+view(id)+'</section>';nav.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.id===id));sidebar.classList.remove("open");window.scrollTo(0,0)}
nav.innerHTML=groups.map(g=>'<div class="group-label">'+g[0]+'</div>'+g[1].map(t=>'<button type="button" class="navbtn" data-id="'+t[0]+'"><span class="symbol">'+t[1]+'</span>'+t[2]+'</button>').join("")).join("");
nav.addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b)go(b.dataset.id)});
document.getElementById("mobilemenu").addEventListener("click",()=>sidebar.classList.toggle("open"));
main.addEventListener("click",e=>{const demo=e.target.closest("[data-demo]");if(demo){if(demo.dataset.demo==="load")loadDemo();else resetDemo();return}const b=e.target.closest("[data-go]");if(b)go(b.dataset.go)});
main.addEventListener("submit",e=>{e.preventDefault();const form=e.target,d=new FormData(form);if(form.dataset.type==="cliente")state.clientes.push(d.get("nome"));if(form.dataset.type==="contrato")state.contratos.push(Object.fromEntries(d));if(form.dataset.type==="nota")state.notas.push({...Object.fromEntries(d),conferido:d.has("conferido")});if(form.dataset.type==="movimento")state.movimentos.push(Object.fromEntries(d));if(form.dataset.type==="titulo")state.titulos.push(Object.fromEntries(d));if(form.dataset.type==="certidao")state.certidoes.push(Object.fromEntries(d));go(current)});
go("inicio");
</script></body></html>
