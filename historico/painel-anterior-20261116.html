function erpStrip(id){const found=tabs.find(x=>x[0]===id);return '<div class="erp-strip"><div class="crumb">MDN Gestão Fiscal / <strong>'+safe(found?found[2]:"Painel de gestão")+'</strong></div><div class="actions"><button type="button" data-go="inicio">Painel</button><button type="button" data-go="notas">Notas fiscais</button><button type="button" data-go="receber">Recebimentos</button></div></div>'}
const nav=document.getElementById("nav"),main=document.getElementById("main"),sidebar=document.getElementById("sidebar");let current="inicio";
function go(id){if(!tabs.some(x=>x[0]===id))id="inicio";current=id;main.innerHTML='<section class="section active">'+erpStrip(id)+(id==="inicio"?"":"<div class=\"demo-alert\">Demonstração: dados fictícios e temporários.</div>")+view(id)+'</section>';nav.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.id===id));sidebar.classList.remove("open");window.scrollTo(0,0)}
nav.innerHTML=groups.map(g=>'<div class="group-label">'+g[0]+'</div>'+g[1].map(t=>'<button type="button" class="navbtn" data-id="'+t[0]+'"><span class="symbol">'+t[1]+'</span>'+t[2]+'</button>').join("")).join("");
nav.addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b)go(b.dataset.id)});
document.getElementById("mobilemenu").addEventListener("click",()=>sidebar.classList.toggle("open"));
main.addEventListener("click",e=>{const settle=e.target.closest("[data-settle]");if(settle){const t=state.titulos[Number(settle.dataset.settle)];if(t){t.situacao=t.situacao==="baixado"?"aberto":"baixado";go(current)}return}const demo=e.target.closest("[data-demo]");if(demo){if(demo.dataset.demo==="load")loadDemo();else resetDemo();return}const b=e.target.closest("[data-go]");if(b)go(b.dataset.go)});
main.addEventListener("submit",e=>{e.preventDefault();const form=e.target,d=new FormData(form);if(form.dataset.type==="cliente")state.clientes.push(d.get("nome"));if(form.dataset.type==="contrato")state.contratos.push(Object.fromEntries(d));if(form.dataset.type==="nota")state.notas.push({...Object.fromEntries(d),conferido:d.has("conferido")});if(form.dataset.type==="movimento")state.movimentos.push(Object.fromEntries(d));if(form.dataset.type==="titulo")state.titulos.push(Object.fromEntries(d));if(form.dataset.type==="certidao")state.certidoes.push(Object.fromEntries(d));go(current)});
