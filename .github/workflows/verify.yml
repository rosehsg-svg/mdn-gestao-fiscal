name: Verificar MDN
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: mdn_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - name: Testar domínio e API PostgreSQL
        env:
          TEST_DATABASE_URL: postgres://test:test-only@localhost:5432/mdn_test
        run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - name: Testar desktop, iPhone e Android
        run: npm run test:browser
      - name: Testar interface privada PostgreSQL
        env:
          TEST_DATABASE_URL: postgres://test:test-only@localhost:5432/mdn_test
        run: node tests/private-browser.cjs
      - name: Preservar ativo original e dependências exatas
        run: node tools/capture-assets.cjs
